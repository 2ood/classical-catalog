services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: classical
      POSTGRES_PASSWORD: classical
      POSTGRES_DB: classical
    ports:
      # Reachable from this machine only.
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
